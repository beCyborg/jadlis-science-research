[pytest]
testpaths = tests
# Network tests (live API recall regression) never run by default — CI has no keys and no right to
# hammer NCBI. Run them explicitly: `pytest tests/test_sp_recall_network.py -m network -q -s`.
addopts = -m "not network"
markers =
    network: hits a live API (PubMed/Crossref); excluded from the default run and from CI
